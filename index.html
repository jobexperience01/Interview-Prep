<script>
const D=[
["1. Professional Introduction and Career",[
["Opening and why InterPro",["Good morning, everyone. How are you all today?","I am doing well, thank you. I really appreciate you considering my application and giving me this opportunity.","My home is a short distance from InterPro. For the last three years, every time I drove past the facility, I hoped that one day I would become a member of this wonderful company. I would like to give special thanks to Mr. John, who put a lot of effort into arranging this meeting today. And finally, here we are!"]],
["Introduction and education",["Thank you for giving me the opportunity to talk about myself. I have completed my Master’s degree in Industrial Systems Engineering from the University of Regina and my Bachelor’s degree in Mechanical Engineering from Rajshahi University of Engineering and Technology. I am an Engineer-in-Training (EIT), registered with APEGS. I also have a valid Saskatchewan Class 5 driver’s license.","I have more than eight years of experience across manufacturing operations, quality assurance, process development, and continuous improvement. I have focused on improving operational performance through structured problem-solving, data analysis, process standardization, and cross-functional collaboration."]],
["RFL: production",["I started my career with RFL Group as an Assistant Manager in the Production Department. I was involved in daily production activities, production planning, procurement, inventory, and quality control. I also worked closely with the maintenance and R&D teams to solve production problems, improve product quality, and reduce production delays. From there I gained practical experience in manufacturing operations, production processes, and shop-floor activities."]],
["Rahimafrooz Globatt: quality assurance",["I joined Rahimafrooz Globatt Limited, a lead-acid battery manufacturer, as Quality Assurance In-Charge. I was responsible for monitoring production quality and process performance. My work included in-process inspections, process capability analysis, SPC, battery performance testing, and incoming raw material inspections. I also worked with suppliers to evaluate their performance and address quality issues."]],
["Green Belt project (lead scrap)",["I applied Lean Six Sigma tools, particularly the DMAIC approach, to reduce lead scrap. We presented this project at the National Annual Quality Convention organized by the Bangladesh Society for Total Quality Management (BSTQM), where our team ranked 3rd among 91 teams. I also developed 145 process documents and coached operators on the production floor to improve consistency and sustain the results.","This experience strengthened my ability to identify problems, analyze root causes, implement countermeasures, and verify their effectiveness. (Numbers: lead scrap 0.65% to 0.20%.)"]],
["Walton: role and approach",["Later, I joined Walton Hi-Tech Industries as Head of the Process Development Department. My department had two main sections: Project Implementation and Product Support. Most of my work was new project implementation, machine installation, process improvement, and supporting production operations.","Whenever we started a new project, I organized kickoff meetings and brainstorming sessions with different departments. I involved shop-floor operators because they understand the actual problems and challenges of the process. I regularly visited the production floor, observed the work, talked with operators, and looked for areas to improve."]],
["Walton: how I run a project",["Before implementing any changes, I first evaluated both operational feasibility and cost feasibility. Then I coordinated with the relevant departments to arrange kickoff meetings, define the project scope (in-scope and out-of-scope activities), and prepare the project Gantt chart with milestones and timelines.","I compared supplier quotations, discussed technical requirements with the team, and arranged question-and-answer sessions with suppliers. After finalizing equipment specifications and production-area requirements, I coordinated machine sourcing, installation, commissioning, and validation. Finally, I arranged operator training, verified production readiness, and completed the project handover. I followed up after implementation to make sure the new process was working and the required standards were maintained."]],
["Walton: equipment implementation",["I supported 17 industrial machines through specification review, installation, validation, start-up, and handover. Eight of those machine projects that I personally managed represented about USD 546,000 in capital.","I managed several installation and improvement projects at once while coordinating cross-functional teams, coaching operators, monitoring KPIs, and preparing technical documentation. By December 2022, seven of the 17 projects on my board were complete."]],
["Walton: analytical skills and achievements",["I was placed fifth among about 30,000 employees in the Walton Excel Excellence Contest / KPI ranking. I have used Excel extensively for data analysis, KPI tracking, dashboards, and reporting, along with PowerPoint and Microsoft Project."]],
["Current role: University of Regina",["Currently, I am working as a Research Associate at the University of Regina. My research is related to MCDA, asset management, supply chain sustainability, and risk and life-cycle assessments. This work has helped me improve my research and data analysis skills.","Between 2024 and 2026 I contributed to eight published papers in these areas."]],
["Brandt: Parts Operations Analyst",["At Brandt’s Regina Head Office, I worked as a Parts Operations Analyst (Co-op), focusing on inventory management, process standardization, and quality improvement. I monitored key inventory KPIs, including fill rates, inventory turns, reorder points, and stock levels, analyzed parts consumption patterns, prioritized parts requests, and coordinated inventory transfers across warehouse locations to prevent stockouts.","I developed the Inventory Auditor Pro app and established a standardized SOP to improve inventory accuracy and operational consistency. The tool cut inventory-logging time from hours to seconds.","I applied Poka-Yoke (mistake-proofing) by introducing a barcode-based verification system to prevent incorrect parts from being shipped to customers, replacing manual part matching. I also implemented a rack organization system that placed items according to picking sequence, improving parts identification, organization, and workflow efficiency."]],
["Closing",["When I look at this Operational Excellence Analyst position, I feel my previous experience is a good match. I have worked with different teams, including production, quality, maintenance, and suppliers. I enjoy working with people, understanding their problems, and finding practical ways to improve processes.","For me, improvement is not just about reducing costs. It’s also about involving employees and making sure the improvements continue. That’s why I’m interested in this opportunity."]]]],
["1B. Development Work",[
["Inter-cell welding process control",["At Rahimafrooz we had two inter-cell welding (ICW) machines operating at around 3,000 amps. We monitored the welding current with a clamp meter to spot unusual fluctuations, and we also monitored the electrical supply voltage.","Stable electricity was important, so we introduced UPS support to reduce interruptions and voltage fluctuations. As a preventive measure, we replaced ICW welding tips after about 2,000 shots, because repeated operation wears the tips and affects weld consistency.","We also did destructive testing by cutting sample batteries and checking internal connections for cold joints, bubbles, incomplete lead flow, missing connections, and excessive lead overflow. Finally, we compared machine readings and inspection results to see which machine produced more defects and needed corrective action or replacement.","This mix of real-time monitoring, preventive tip replacement, controlled destructive testing, and data comparison kept welding quality stable and reduced variation."]],
["In-motion weighing system for pasted battery plates",["Actually, our main objective was to move from batch sampling to 100% inspection of individual pasted plate weight without stopping the production line.","So, we proposed installing a small weighing section underneath the conveyor belt, supported by load cells.","When each plate moves onto the weighing section, its weight creates a downward force on the load cells. Inside the load cells, there are strain gauges attached to a metal body. When the plate applies force, the metal body deforms very slightly. The strain gauges detect this deformation through a change in electrical resistance.","This change produces a small electrical signal. The weighing controller processes that signal and converts it into an actual weight through calibration.","We also proposed using a speed sensor, usually an encoder, to monitor conveyor movement. It detects the rotation of the drive roller and sends electrical pulses to the controller. The controller uses this information to calculate conveyor speed and synchronize the weighing process. This helps it identify when each plate enters and leaves the weighing section.","After measuring the weight, the system sends the result to the PLC. The PLC compares the measured weight against the predefined acceptable range.","If the plate weight is within the acceptable range, it continues along the normal conveyor. However, if it is underweight or overweight, the PLC tracks its position using the encoder information. When that plate reaches the rejection point, the PLC activates a pneumatic pusher to remove it from the main conveyor and direct it to a separate collection area.","The HMI displays the weight readings, system status, and any out-of-range alarms.","So, the main benefit is that we can inspect every pasted plate individually, identify weight variations in real time, and automatically separate defective plates without stopping production. This would help reduce quality variation, minimize manual inspection, and improve overall process consistency."]],
["Walton: problem-solving examples",["I applied A3 problem-solving, fishbone diagrams, the 5 Whys, root-cause analysis, and PDCA. For lead-chip generation and welding-related issues, I contributed countermeasures such as improving operator welding practices, coordinating maintenance, a conveyor to return lead chips to the lead pot, an online feed bar, and an online integrated system to help prevent sudden electricity fluctuations. I also supported 5S, operator training, and standardized process controls.","Solving a problem is not enough: we must standardize the solution, train employees, and monitor the process so the improvement is sustained."]]]],
["2. Technical Skills and Software",[
["2.1 Technical skills",["I am proficient in Excel, PowerPoint, Microsoft Project, value stream mapping, process mapping, and KPI monitoring. For analysis and visualization I use Python, Jupyter Notebook, and Google Data Studio / Looker Studio. I also have experience with GaBi for life-cycle assessment, SolidWorks, AutoCAD, and HTML, CSS, and JavaScript. I have built practical digital tools (AppSheet inventory auditor, quality dashboards, project-status boards) that move data from paper or spreadsheets into live, usable systems."]]]],
["3. Leadership, Teamwork, Projects",[
["3.1 Leadership and cross-functional collaboration",["Operational excellence is achieved by engaging people, understanding their challenges, and involving them in the improvement process. I collaborate through coaching, brainstorming, structured problem-solving, and data-driven decisions, using Lean Six Sigma, PDCA, root-cause analysis, FMEA, SPC, KPI monitoring, Poka-Yoke, SOPs, process mapping, and VSM. At Rahimafrooz and Walton I coached operators on the floor and facilitated quality-circle and improvement workshops."]],
["3.2 Managing multiple priorities",["At Walton I handled several equipment implementation and improvement projects (17 on the board at one point) while supporting operator coaching, KPI tracking, and technical documentation. I prioritized by business impact, deadlines, and operational requirements. Monthly project-status reporting kept stakeholders aligned on progress, risks, and next steps."]]]],
["4. Closing: Why I Suit InterPro",[
["4.1 Overall professional value",["I bring engineering knowledge, practical manufacturing experience in both battery and consumer-electronics production, analytical capability, and continuous improvement leadership. I have delivered measurable results (lead-scrap reduction, machine commissioning on schedule, digital audit tools that cut logging time dramatically) and worked in certified quality, environmental, and occupational-health systems.","In this role I would engage and lead cross-functional groups, facilitate brainstorming and improvement workshops, identify process inefficiencies, analyze performance data, and develop and implement operational excellence strategies, so improvements are sustainable. My base in Regina and EIT status with APEGS let me contribute immediately within a Saskatchewan heavy-manufacturing environment."]]]],
["5. Company Knowledge: InterPro",[
["5.1 What do you know about InterPro?",["From what I understand, InterPro Pipe & Steel is a major Canadian steel manufacturer producing steel pipes and coils mainly for the energy and industrial sectors.","I also learned it operates in Regina and Red Deer and supplies oil and gas pipelines, as well as newer areas like hydrogen and carbon capture.","I found its focus on sustainability interesting, for example electric arc furnace technology and water recycling facilities in Regina. I understand this is heavy manufacturing where production efficiency, quality, safety, and continuous improvement are very important.","That is why I am interested. My experience in production, QA, process development, and Lean Six Sigma is closely related. High-current welding process control, machine commissioning, KPI-driven improvement, and digital standardization tools would transfer well to pipe and coil manufacturing.","(Check before the interview: confirm Red Deer and water recycling on InterPro’s website.)"]]]],
["6. Practical Safety: Battery Manufacturing",[
["6.1 Specific gravity and acid handling",["We used a hydrometer to take electrolyte samples. Since sulfuric acid is corrosive, PPE was important: acid-resistant gloves, safety goggles, face shields, and protective aprons. Eyewash stations and spill kits were available nearby."]],
["6.2 Battery lifting and material handling",["We used hoists, lifting attachments, and material-handling equipment suited to battery size and weight. Operators were trained, equipment was inspected, and nobody stood under a suspended load. This reduced manual handling injuries and dropped-battery risk. I also developed visual crane-zone safety markings to keep people clear of lifting areas."]],
["6.3 Battery cutting for internal inspection",["Safety mattered especially because of possible sulfuric acid and lead exposure. We needed proper isolation, a controlled cutting area with ventilation and machine guards, and operators in respiratory protection, chemical-resistant gloves, goggles, and protective clothing. We followed proper procedures for collecting and disposing of lead-contaminated materials."]]]],
["7. Management Systems: ISO, EHS, Safety",[
["7.1 Certified management systems",["At Rahimafrooz I worked in a plant that followed certified management systems and well-known improvement practices."]],
["7.2 ISO 14001:2015",["The company was certified for ISO 14001:2015 (Environmental Management System) and OHSAS 18001:2007 (Occupational Health and Safety). ISO 14001 does not set fixed performance targets; it gives a framework based on Plan-Do-Check-Act: plan objectives and processes, implement, measure and monitor, then act to improve."]],
["7.3 OHSAS 18001:2007",["OHSAS 18001 gave us a framework to identify, control, and reduce health and safety risks. I took part in EHS management system auditing. (If asked: ISO 45001 has since replaced OHSAS 18001.)"]],
["7.4 LOTO and risk assessment",["We applied Lockout-Tagout so machines were shut off and could not restart during maintenance. We used a risk matrix, rating severity and probability, to assess hazards and set priorities."]]]],
["8. Lean Tools",[
["8.1 Tools and Skills",["Along with my work experience, I have used various Lean, quality, and problem-solving tools, including Lean Six Sigma, DMAIC, PDCA, 5 Whys, Fishbone Diagrams, FMEA, SPC, 5S, Kaizen, process mapping, and KPI monitoring.","I also have experience with Microsoft Excel, PowerPoint, Microsoft Project, Python, and data analysis tools."]],
["8.2 Lean Tools and Techniques",["<b>5S</b>: Sort, Set in Order, Shine, Standardize, and Sustain. Used to organize the workplace, reduce unnecessary movement, and maintain an efficient working environment.","<b>Kaizen</b>: Continuous improvement through small, steady changes involving employees at all levels.","<b>Poka-Yoke</b>: Mistake-proofing techniques to prevent human errors before they cause defects. I later applied the same principle in the Inventory Auditor Pro tool at Brandt.","<b>Lean Six Sigma (DMAIC)</b>: Define, Measure, Analyze, Improve, and Control. Used to identify root causes, reduce process variation, and improve process performance.","<b>Value Stream Mapping (VSM)</b>: Mapping current and future process states to identify bottlenecks, non-value-added activities, and improvement opportunities.","<b>Other Problem-Solving Tools</b>: Benchmarking, Pareto Analysis, A3 Problem Solving, 5 Whys, Fishbone Diagrams, and PDCA.","<b>Eight Wastes (TIMWOODS)</b>: Identifying and eliminating eight types of waste that do not add value to the customer or production process:","<ul><li><b>T – Transportation</b>: Unnecessary movement of materials.</li><li><b>I – Inventory</b>: Excess raw materials, work-in-progress, or finished goods.</li><li><b>M – Motion</b>: Unnecessary movement of workers.</li><li><b>W – Waiting</b>: Idle time due to delays in materials, machines, or information.</li><li><b>O – Overproduction</b>: Producing more than required.</li><li><b>O – Overprocessing</b>: Performing unnecessary steps beyond customer requirements.</li><li><b>D – Defects</b>: Errors requiring rework, repair, or rejection.</li><li><b>S – Skills (Unused Talent)</b>: Not fully utilizing employees' knowledge, experience, and ideas.</li></ul>"]],
["8.3 Production Performance",["<ul><li><b>Overall Equipment Effectiveness (OEE)</b>: Measures equipment effectiveness through Availability, Performance, and Quality to identify production losses and improvement opportunities.</li><li><b>Standard Allowed Minutes (SAM)</b>: Establishes the standard time allowed to complete a production operation, including allowances, for production planning and efficiency measurement.</li><li><b>Cycle Time (CT)</b>: Measures the time required to complete one production cycle or unit, helping identify delays and bottlenecks.</li></ul>"]]]],
["8B. VSM and Production Lean Tools",[
["VSM metrics: time, uptime, yield, OEE",["<b>Takt Time</b>: the maximum time allowed to produce one unit to meet customer demand. Takt Time = Available Production Time ÷ Customer Demand.","<b>Cycle Time</b>: the actual time a machine or process needs to complete one unit.","<b>Uptime</b>: machine ran 95 hours out of 100 planned hours, so Uptime = 95%. <b>Downtime</b>: machine stops for 5 hours due to breakdown.","<b>Yield</b>: 1000 batteries started, 990 pass = 99% yield.","<b>First Pass Yield (FPY)</b>: passing inspection the first time without rework. 950 pass without rework out of 1000 = 95% FPY.","<b>OEE (Overall Equipment Effectiveness)</b> = Availability × Performance × Quality. Availability = Operating Time ÷ Planned Production Time. Performance = (Ideal Cycle Time × Total Output) ÷ Operating Time. Quality = Good Units ÷ Total Units."]],
["VSM flow: push, pull, WIP, lead time",["<b>Effective Cycle Time</b>: actual production time available per good unit after considering the number of parallel machines, machine uptime (95 hr / 100 hr), and production yield (990 pass / 1000 batteries).","<b>Push System</b>: grid production continues even when pasting has excess inventory. <b>Pull System</b>: assembly requests batteries or components only when needed.","<b>WIP Limit</b>: no more than 2000 units in an Assembly FIFO line.","<b>Inventory Turnover</b>: how frequently inventory is used or sold during a period.","<b>Lead Time</b>: total time from when production starts until the finished product is ready for delivery. <b>Processing Time</b>: time actually spent performing production activities."]],
["VSM value-added analysis: VA, NVA, NNVA, PCE",["<b>Value-Added Time (VA)</b>: applying active materials to battery grids or assembling battery components.","<b>Non-Value-Added Time (NVA)</b>: unnecessary transport and excessive waiting.","<b>Necessary Non-Value-Added Time (NNVA)</b>: battery curing or mandatory safety inspection.","<b>Process Cycle Efficiency (PCE)</b> = Value-Added Time ÷ Total Lead Time, the percentage of lead time spent on value-added activities. Example: about 0.048%. A higher PCE generally indicates less waiting and less waste."]]]],
["9. Quality Control and Statistics",[
["9.1 SPC",["We used Statistical Process Control to monitor the process in real time and catch trends before non-conforming product appeared, moving quality from detection to prevention. The same mindset guided clamp-meter monitoring of the 3,000-amp ICW machines."]],
["9.2 Pareto analysis",["Pareto charts find the biggest causes of defects so we focus on the vital few."]],
["9.3 Cpk",["Cpk measures process capability. A Cpk of 1.33 or higher means the process is capable and meets specification limits. Below that, variation is too wide or the average is off target."]]]],
["10. Learning and Philosophy",[
["10.1 Quality, safety, environment",["Quality, safety, and environmental responsibility work together, and preventing problems is better than inspecting for them afterward. Whether monitoring welding current and tip life, standardizing an inventory audit with a mobile app, or commissioning a 400-ton press, the principles are the same: measure, stabilize, standardize, train, and sustain."]]]],
["11. Questions to Ask the Interviewer",[
["Opening line",["“Yes, thank you. I have a couple of questions. Based on our discussion today, is there anything about my experience or background that you would like me to clarify further?” (Pause and listen. If nothing more, continue.)"]],
["Question 1",["“Could you please tell me what would be the main priorities for this position during the first three to six months?”"]],
["Question 2",["“What are some of the major operational challenges the company is currently trying to improve?”"]]]],
["Q. Quick Talking Points",[
["Numbers to remember",["Lead scrap 0.65% to 0.20% (DMAIC + PDCA), 3rd of 91 teams.","ICW welding: 3,000 A, clamp meter, UPS, tip change at about 2,000 shots, destructive testing, machine comparison.","Walton: 17 machines on the board, 8 personally managed (about USD 546k), 7 completed by Dec 2022.","5th of about 30,000 employees in the Walton Excel / KPI contest.","Brandt: AppSheet auditor cut logging time from hours to seconds, plus Poka-Yoke.","Current: Research Associate, University of Regina; EIT (APEGS); 8 papers 2024 to 2026.","Advantage: already based in Regina."]]]]
];
const SB=[['Opening','Intro','RFL','Globatt QA','Green Belt','Walton role','Walton projects','Walton equipment','Walton data','U of Regina','Brandt','Closing'],['ICW welding','Plate weighing','Walton problems'],['Skills'],['Leadership','Priorities'],['Value'],['InterPro'],['Acid','Lifting','Cutting'],['Systems','ISO 14001','OHSAS 18001','LOTO & risk'],['Tools & skills','Techniques','Performance'],['Metrics','Flow','Value-added'],['SPC','Pareto','Cpk'],['Philosophy'],['Opening','Q1','Q2'],['Numbers']];
const LB=['Intro & Career','Development Work','Tech Skills','Leadership','Why Me','About InterPro','Safety Stories','ISO & EHS','Lean Tools','VSM & Metrics','Quality & Stats','Philosophy','Ask Them','Quick Facts'];
const N=document.getElementById('nav'),M=document.getElementById('m'),TP=document.getElementById('tp'),SU=document.getElementById('sub'),SL=document.getElementById('sl');let ct=0;
M.innerHTML=D.map((d,i)=>'<section>'+d[1].map((x,k)=>'<details open data-s="'+i+'" data-k="'+k+'"><summary>'+x[0]+'</summary><div class="b">'+x[1].map(p=>'<p>'+p+'</p>').join('')+'</div></details>').join('')+'</section>').join('');
const sh=()=>document.documentElement.style.setProperty('--nh',N.offsetHeight+'px');addEventListener('resize',sh);
function show(i,k){ct=i;
[...TP.children].forEach((b,j)=>b.classList.toggle('on',j===i));
const multi=D[i][1].length>1;
SU.innerHTML=multi?'<button data-k="-1">All</button>'+SB[i].map((l,j)=>'<button data-k="'+j+'">'+l+'</button>').join(''):'';
[...SU.children].forEach(b=>b.classList.toggle('on',+b.dataset.k===k));
SU.style.display=SL.style.display=multi?'':'none';
M.querySelectorAll('section').forEach((e,j)=>e.style.display=j===i?'block':'none');
M.querySelectorAll('details').forEach(d=>{const v=+d.dataset.s===i&&(k<0||+d.dataset.k===k);d.style.display=v?'block':'none'});
sh();scrollTo(0,0)}
D.forEach((d,i)=>{const b=document.createElement('button');b.textContent=LB[i];b.title=d[0];b.onclick=()=>show(i,-1);TP.appendChild(b)});
const OP=document.getElementById('op');OP.hidden=false;TP.appendChild(OP);
SU.onclick=e=>{if(e.target.dataset.k!==undefined)show(ct,+e.target.dataset.k)};
document.getElementById('op').onclick=e=>{const ds=[...M.querySelectorAll('details')].filter(d=>d.style.display!=='none');const all=ds.every(d=>d.open);ds.forEach(d=>d.open=!all);e.target.textContent=all?'Open all':'Fold all'};
show(0,-1);
</script></body></html>
